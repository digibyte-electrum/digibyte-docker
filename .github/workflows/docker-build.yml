name: Build DigiByte Core Docker

on:
  workflow_dispatch:
    inputs:
      digibyte_sha256:
        description: "Verified SHA256 of the official Linux x86_64 archive"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and verify AMD64 image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate SHA256 input
        env:
          EXPECTED_SHA: ${{ inputs.digibyte_sha256 }}
        run: |
          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Invalid SHA256 value"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        env:
          EXPECTED_SHA: ${{ inputs.digibyte_sha256 }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg DIGIBYTE_VERSION=9.26.7 \
            --build-arg DIGIBYTE_SHA256="$EXPECTED_SHA" \
            --tag digibyte-core:test-9.26.7 \
            --load \
            .

      - name: Verify DigiByte Core version
        run: |
          docker run --rm \
            digibyte-core:test-9.26.7 \
            --version | tee version.txt

          grep -F "9.26.7" version.txt

      - name: Inspect image
        run: |
          docker image inspect digibyte-core:test-9.26.7 \
            --format='Image: {{.Id}}'
      
      - name: Smoke test DigiByte daemon
        shell: bash
        run: |
          set -euo pipefail

          docker volume create digibyte-smoke-data

          cleanup() {
            docker rm -f digibyte-smoke 2>/dev/null || true
            docker volume rm digibyte-smoke-data 2>/dev/null || true
          }
          trap cleanup EXIT

          docker run -d \
            --name digibyte-smoke \
            --network none \
            --mount type=volume,source=digibyte-smoke-data,target=/opt/blockchain/data \
            digibyte-core:test-9.26.7 \
            -datadir=/opt/blockchain/data \
            -regtest \
            -server=1 \
            -listen=0 \
            -dnsseed=0 \
            -discover=0 \
            -connect=0 \
            -rpcuser=smoketest \
            -rpcpassword=temporary-ci-password

          echo "Waiting for RPC initialization..."

          ready=0

          for i in $(seq 1 30); do
            if docker exec digibyte-smoke \
              digibyte-cli \
              -datadir=/opt/blockchain/data \
              -regtest \
              -rpcuser=smoketest \
              -rpcpassword=temporary-ci-password \
              getblockchaininfo > blockchaininfo.json 2>/dev/null; then
              ready=1
              break
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' digibyte-smoke)" != "true" ]; then
              docker logs digibyte-smoke
              exit 1
            fi

            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            docker logs digibyte-smoke
            exit 1
          fi

          cat blockchaininfo.json

          grep -q '"chain": "regtest"' blockchaininfo.json

          echo "DigiByte daemon smoke test passed"

